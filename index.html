<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAK EARN - Admin Panel</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0a0f1e, #1a1a2e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-container {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 20px;
            width: 90%;
            max-width: 400px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .login-container h2 {
            color: #00a859;
            text-align: center;
            margin-bottom: 30px;
        }
        .login-container input {
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 10px;
            color: white;
            font-size: 16px;
        }
        .login-container input::placeholder {
            color: #8b92a8;
        }
        .login-container button {
            width: 100%;
            padding: 15px;
            background: #00a859;
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .login-container button:hover {
            background: #008040;
        }
        .message {
            margin-top: 20px;
            padding: 10px;
            border-radius: 10px;
            text-align: center;
            display: none;
        }
        .error {
            background: rgba(231,76,60,0.2);
            color: #e74c3c;
            border: 1px solid #e74c3c;
        }
        .success {
            background: rgba(46,204,113,0.2);
            color: #2ecc71;
            border: 1px solid #2ecc71;
        }
        .info {
            background: rgba(52,152,219,0.2);
            color: #3498db;
            border: 1px solid #3498db;
        }
        .admin-panel {
            display: none;
            width: 100%;
            min-height: 100vh;
        }
        .dashboard {
            padding: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: rgba(255,255,255,0.05);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
        }
        .stat-card h3 {
            color: #8b92a8;
            font-size: 14px;
            margin-bottom: 10px;
        }
        .stat-card .value {
            color: #00a859;
            font-size: 28px;
            font-weight: bold;
        }
        .section {
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .section h3 {
            color: #00a859;
            margin-bottom: 15px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            overflow-x: auto;
            display: block;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            color: #cbd5e0;
        }
        th {
            color: #00a859;
        }
        button {
            background: #00a859;
            border: none;
            padding: 8px 15px;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            margin: 5px;
        }
        .logout-btn {
            background: #e74c3c;
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
        }
        .status-pending {
            background: rgba(255,165,0,0.2);
            color: #ffa500;
            padding: 4px 8px;
            border-radius: 5px;
            font-size: 12px;
        }
        .status-approved {
            background: rgba(46,204,113,0.2);
            color: #2ecc71;
            padding: 4px 8px;
            border-radius: 5px;
            font-size: 12px;
        }
        .status-blocked {
            background: rgba(231,76,60,0.2);
            color: #e74c3c;
            padding: 4px 8px;
            border-radius: 5px;
            font-size: 12px;
        }
        .btn-approve {
            background: #2ecc71;
        }
        .btn-reject {
            background: #e74c3c;
        }
        .btn-block {
            background: #e74c3c;
        }
        .btn-unblock {
            background: #2ecc71;
        }
        @media (max-width: 768px) {
            th, td {
                padding: 8px;
                font-size: 12px;
            }
            button {
                padding: 5px 10px;
                font-size: 11px;
            }
            .dashboard {
                padding: 15px;
            }
        }
    </style>
</head>
<body>

<div id="loginPage" class="login-container">
    <h2><i class="fas fa-crown"></i> PAK EARN ADMIN</h2>
    <input type="email" id="adminEmail" placeholder="Admin Email" value="admin@pakearn.com">
    <input type="password" id="adminPassword" placeholder="Password" value="Admin@123">
    <button onclick="adminLogin()"><i class="fas fa-sign-in-alt"></i> LOGIN</button>
    <div id="loginMessage" class="message"></div>
    <div style="text-align: center; margin-top: 20px; color: #666; font-size: 12px;">
        <hr style="margin: 15px 0; border-color: rgba(255,255,255,0.1);">
        Default: admin@pakearn.com / Admin@123
    </div>
</div>

<div id="adminPanel" class="admin-panel">
    <button class="logout-btn" onclick="adminLogout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
    
    <div class="dashboard">
        <h1 style="color: #00a859; margin-bottom: 20px;"><i class="fas fa-chart-line"></i> Dashboard</h1>
        
        <div class="stats">
            <div class="stat-card">
                <h3><i class="fas fa-users"></i> Total Users</h3>
                <div class="value" id="totalUsers">0</div>
            </div>
            <div class="stat-card">
                <h3><i class="fas fa-clock"></i> Pending Deposits</h3>
                <div class="value" id="pendingDeposits">0</div>
            </div>
            <div class="stat-card">
                <h3><i class="fas fa-clock"></i> Pending Withdrawals</h3>
                <div class="value" id="pendingWithdrawals">0</div>
            </div>
        </div>
        
        <div class="section">
            <h3><i class="fas fa-users"></i> All Users</h3>
            <div style="overflow-x: auto;">
                <table id="usersTable">
                    <thead>
                        <tr><th>Name</th><th>Email</th><th>Phone</th><th>Deposit Bal</th><th>Profit Bal</th><th>Status</th><th>Actions</th></tr>
                    </thead>
                    <tbody id="usersList"></tbody>
                </table>
            </div>
        </div>
        
        <div class="section">
            <h3><i class="fas fa-arrow-down"></i> Pending Deposits</h3>
            <div style="overflow-x: auto;">
                <table id="depositsTable">
                    <thead>
                        <tr><th>User</th><th>Amount</th><th>Transaction ID</th><th>Date</th><th>Action</th></tr>
                    </thead>
                    <tbody id="depositsList"></tbody>
                </table>
            </div>
        </div>
        
        <div class="section">
            <h3><i class="fas fa-arrow-up"></i> Pending Withdrawals</h3>
            <div style="overflow-x: auto;">
                <table id="withdrawalsTable">
                    <thead>
                        <tr><th>User</th><th>Amount</th><th>Method</th><th>Account</th><th>Date</th><th>Action</th></tr>
                    </thead>
                    <tbody id="withdrawalsList"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    // 🔥🔥🔥 YOUR NEW FIREBASE CONFIG 🔥🔥🔥
    const firebaseConfig = {
        apiKey: "AIzaSyD5DvpTiKztjQ_RivjOHqEsNh9K6MMFQJI",
        authDomain: "kharal-b47b6.firebaseapp.com",
        databaseURL: "https://kharal-b47b6-default-rtdb.firebaseio.com",
        projectId: "kharal-b47b6",
        storageBucket: "kharal-b47b6.firebasestorage.app",
        messagingSenderId: "528214841740",
        appId: "1:528214841740:web:9b50ad13927e26c66e9ea9"
    };
    
    // Initialize Firebase
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    
    const auth = firebase.auth();
    const db = firebase.database();
    
    let currentAdmin = null;
    
    function showMessage(msg, type) {
        const msgDiv = document.getElementById('loginMessage');
        msgDiv.innerHTML = msg;
        msgDiv.className = 'message ' + type;
        msgDiv.style.display = 'block';
        setTimeout(() => msgDiv.style.display = 'none', 5000);
    }
    
    async function adminLogin() {
        const email = document.getElementById('adminEmail').value;
        const password = document.getElementById('adminPassword').value;
        
        if (!email || !password) {
            showMessage("Please enter email and password", "error");
            return;
        }
        
        showMessage("Logging in...", "info");
        
        try {
            const userCredential = await auth.signInWithEmailAndPassword(email, password);
            currentAdmin = userCredential.user;
            
            // Check if admin exists in database
            const adminCheck = await db.ref('admins/' + currentAdmin.uid).once('value');
            if (!adminCheck.exists()) {
                // Add to admin list
                await db.ref('admins/' + currentAdmin.uid).set({
                    email: email,
                    role: 'admin',
                    createdAt: new Date().toLocaleString()
                });
            }
            
            document.getElementById('loginPage').style.display = 'none';
            document.getElementById('adminPanel').style.display = 'block';
            loadDashboard();
            showMessage("Login successful! Welcome Admin.", "success");
            
        } catch (err) {
            let errorMsg = err.message;
            if (err.code === 'auth/user-not-found') {
                errorMsg = "Admin account not found! First create admin in Firebase Console.";
            } else if (err.code === 'auth/wrong-password') {
                errorMsg = "Wrong password!";
            } else if (err.code === 'auth/operation-not-allowed') {
                errorMsg = "Email/Password authentication is disabled! Enable it in Firebase Console.";
            }
            showMessage("Login Failed: " + errorMsg, "error");
        }
    }
    
    function adminLogout() {
        auth.signOut();
        currentAdmin = null;
        document.getElementById('loginPage').style.display = 'flex';
        document.getElementById('adminPanel').style.display = 'none';
    }
    
    async function loadDashboard() {
        try {
            // Load users
            const usersSnap = await db.ref('users').once('value');
            const users = usersSnap.val() || {};
            document.getElementById('totalUsers').innerText = Object.keys(users).length;
            
            // Load pending deposits
            const depositsSnap = await db.ref('deposits').once('value');
            const deposits = depositsSnap.val() || {};
            let pendingDeposits = 0;
            Object.values(deposits).forEach(d => {
                if (d.status === 'pending') pendingDeposits++;
            });
            document.getElementById('pendingDeposits').innerText = pendingDeposits;
            
            // Load pending withdrawals
            const withdrawalsSnap = await db.ref('withdrawals').once('value');
            const withdrawals = withdrawalsSnap.val() || {};
            let pendingWithdrawals = 0;
            Object.values(withdrawals).forEach(w => {
                if (w.status === 'pending') pendingWithdrawals++;
            });
            document.getElementById('pendingWithdrawals').innerText = pendingWithdrawals;
            
            // Display users
            const usersList = document.getElementById('usersList');
            usersList.innerHTML = '';
            Object.entries(users).forEach(([uid, u]) => {
                const statusClass = u.status === 'blocked' ? 'status-blocked' : (u.status === 'active' ? 'status-approved' : 'status-pending');
                usersList.innerHTML += `
                    <tr>
                        <td>${u.username || 'N/A'}</td>
                        <td>${u.email || 'N/A'}</td>
                        <td>${u.phone || 'N/A'}</td>
                        <td>Rs ${(u.depositBalance || 0).toFixed(2)}</td>
                        <td>Rs ${(u.balance || 0).toFixed(2)}</td>
                        <td><span class="${statusClass}">${u.status || 'active'}</span></td>
                        <td>
                            ${u.status === 'blocked' ? 
                                `<button class="btn-unblock" onclick="toggleUserStatus('${uid}')">Unblock</button>` : 
                                `<button class="btn-block" onclick="toggleUserStatus('${uid}')">Block</button>`
                            }
                         </td>
                    </tr>
                `;
            });
            
            // Display pending deposits
            const depositsList = document.getElementById('depositsList');
            depositsList.innerHTML = '';
            Object.entries(deposits).forEach(([did, d]) => {
                if (d.status === 'pending') {
                    depositsList.innerHTML += `
                        <tr>
                            <td>${d.username || 'N/A'}</td>
                            <td>Rs ${d.amount}</td>
                            <td>${d.tid || 'N/A'}</td>
                            <td>${d.date || 'N/A'}</td>
                            <td>
                                <button class="btn-approve" onclick="approveDeposit('${did}', ${d.amount}, '${d.uid}', '${d.referredBy || ''}')">Approve</button>
                                <button class="btn-reject" onclick="rejectDeposit('${did}')">Reject</button>
                             </td>
                        </tr>
                    `;
                }
            });
            
            if (depositsList.innerHTML === '') {
                depositsList.innerHTML = '<tr><td colspan="5" style="text-align:center;">No pending deposits</td></tr>';
            }
            
            // Display pending withdrawals
            const withdrawalsList = document.getElementById('withdrawalsList');
            withdrawalsList.innerHTML = '';
            Object.entries(withdrawals).forEach(([wid, w]) => {
                if (w.status === 'pending') {
                    withdrawalsList.innerHTML += `
                        <tr>
                            <td>${w.username || 'N/A'}</td>
                            <td>Rs ${w.amount}</td>
                            <td>${w.method || 'N/A'}</td>
                            <td>${w.account || 'N/A'}</td>
                            <td>${w.date || 'N/A'}</td>
                            <td>
                                <button class="btn-approve" onclick="approveWithdraw('${wid}')">Approve</button>
                                <button class="btn-reject" onclick="rejectWithdraw('${wid}', ${w.amount}, '${w.uid}')">Reject</button>
                             </td>
                        </tr>
                    `;
                }
            });
            
            if (withdrawalsList.innerHTML === '') {
                withdrawalsList.innerHTML = '<tr><td colspan="6" style="text-align:center;">No pending withdrawals</td></tr>';
            }
            
        } catch (err) {
            console.error("Error loading dashboard:", err);
        }
    }
    
    async function toggleUserStatus(uid) {
        const userSnap = await db.ref('users/' + uid).once('value');
        const user = userSnap.val();
        const newStatus = user.status === 'blocked' ? 'active' : 'blocked';
        await db.ref('users/' + uid).update({ status: newStatus });
        loadDashboard();
    }
    
    async function approveDeposit(did, amount, uid, referredBy) {
        if (confirm(`Approve deposit of Rs ${amount}?`)) {
            await db.ref('deposits/' + did).update({ status: 'approved' });
            const userSnap = await db.ref('users/' + uid).once('value');
            const user = userSnap.val();
            await db.ref('users/' + uid').update({
                depositBalance: (user.depositBalance || 0) + amount,
                hasDeposited: true
            });
            
            // Add 5% commission to referrer
            if (referredBy && referredBy !== "none") {
                const refSnap = await db.ref('users/' + referredBy).once('value');
                const referrer = refSnap.val();
                if (referrer) {
                    const commission = amount * 0.05;
                    await db.ref('users/' + referredBy).update({
                        pendingCommission: (referrer.pendingCommission || 0) + commission
                    });
                    
                    await db.ref('commissionHistory').push({
                        referrerUID: referredBy,
                        fromUID: uid,
                        fromUsername: user.username || 'User',
                        amount: commission,
                        date: new Date().toLocaleString()
                    });
                }
            }
            
            loadDashboard();
        }
    }
    
    async function rejectDeposit(did) {
        if (confirm("Reject this deposit?")) {
            await db.ref('deposits/' + did).update({ status: 'rejected' });
            loadDashboard();
        }
    }
    
    async function approveWithdraw(wid) {
        if (confirm("Approve this withdrawal?")) {
            await db.ref('withdrawals/' + wid).update({ status: 'approved' });
            loadDashboard();
        }
    }
    
    async function rejectWithdraw(wid, amount, uid) {
        if (confirm("Reject this withdrawal? Amount will be returned to user.")) {
            await db.ref('withdrawals/' + wid).update({ status: 'rejected' });
            const userSnap = await db.ref('users/' + uid).once('value');
            const user = userSnap.val();
            await db.ref('users/' + uid).update({
                balance: (user.balance || 0) + amount
            });
            loadDashboard();
        }
    }
    
    // Auto create default admin if not exists
    async function setupDefaultAdmin() {
        try {
            // Check if any admin exists
            const adminCheck = await db.ref('admins').once('value');
            if (!adminCheck.exists()) {
                // Try to create default admin account
                try {
                    const userCred = await auth.createUserWithEmailAndPassword('admin@pakearn.com', 'Admin@123');
                    await db.ref('admins/' + userCred.user.uid).set({
                        email: 'admin@pakearn.com',
                        role: 'super_admin',
                        createdAt: new Date().toLocaleString()
                    });
                    console.log('Default admin created successfully!');
                } catch (err) {
                    if (err.code === 'auth/email-already-in-use') {
                        console.log('Admin account already exists');
                    } else if (err.code === 'auth/operation-not-allowed') {
                        console.log('⚠️ Please enable Email/Password authentication in Firebase Console!');
                    } else {
                        console.log('Admin setup error:', err.message);
                    }
                }
            }
        } catch (err) {
            console.log('Setup error:', err.message);
        }
    }
    
    setupDefaultAdmin();
</script>
</body>
</html>
