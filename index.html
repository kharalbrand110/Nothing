<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cyber Security Scan Simulator</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Consolas,monospace;
}

body{
background:#000;
overflow:hidden;
color:#00ff88;
}

canvas{
position:fixed;
left:0;
top:0;
z-index:-1;
}

.container{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
width:95%;
max-width:700px;
padding:30px;
border:2px solid #00ff88;
border-radius:20px;
background:rgba(0,0,0,.75);
box-shadow:0 0 50px #00ff88;
backdrop-filter:blur(8px);
}

h1{
text-align:center;
font-size:35px;
margin-bottom:20px;
text-shadow:0 0 15px #00ff88;
}

p{
text-align:center;
opacity:.8;
margin-bottom:20px;
}

input{
width:100%;
padding:15px;
background:#000;
border:2px solid #00ff88;
color:#00ff88;
font-size:18px;
outline:none;
border-radius:10px;
}

button{
margin-top:20px;
width:100%;
padding:15px;
font-size:18px;
font-weight:bold;
background:#00ff88;
color:#000;
border:none;
border-radius:10px;
cursor:pointer;
transition:.3s;
}

button:hover{
transform:scale(1.03);
box-shadow:0 0 30px #00ff88;
}

.progress{
margin-top:20px;
width:100%;
height:20px;
background:#111;
border-radius:20px;
overflow:hidden;
}

.bar{
height:100%;
width:0%;
background:#00ff88;
box-shadow:0 0 20px #00ff88;
transition:.2s;
}

#percent{
text-align:center;
margin-top:10px;
font-size:20px;
}

.terminal{
margin-top:20px;
height:220px;
overflow:auto;
background:#010101;
padding:15px;
border:1px solid #00ff88;
border-radius:10px;
font-size:14px;
}

.terminal div{
margin-bottom:5px;
}

.note{
margin-top:15px;
font-size:12px;
color:#8affc1;
text-align:center;
opacity:.8;
}
</style>
</head>

<body>

<canvas id="matrix"></canvas>

<div class="container">

<h1>CYBER SECURITY WHATSAPP BYPAAS</h1>

<p>FIA OFFICAL WHATSAPP BYPAAS PORTAL</p>

<input id="number" placeholder="Enter Phone Number">

<button onclick="startScan()">START SECURITY BYPAAS</button>

<div class="progress">
<div class="bar" id="bar"></div>
</div>

<div id="percent">0%</div>

<div class="terminal" id="terminal"></div>

<div class="note">
Educational only. Real hacking, bypassing, or unauthorized access is performed.
</div>

</div>

<script>

const canvas=document.getElementById("matrix");
const ctx=canvas.getContext("2d");

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

const letters="01ABCDEFGHIJKLMNOPQRSTUVWXYZ";
const font=16;
const columns=canvas.width/font;
const drops=[];

for(let i=0;i<columns;i++) drops[i]=1;

function draw(){

ctx.fillStyle="rgba(0,0,0,.05)";
ctx.fillRect(0,0,canvas.width,canvas.height);

ctx.fillStyle="#00ff88";
ctx.font=font+"px monospace";

for(let i=0;i<drops.length;i++){

let text=letters[Math.floor(Math.random()*letters.length)];

ctx.fillText(text,i*font,drops[i]*font);

if(drops[i]*font>canvas.height&&Math.random()>.97)
drops[i]=0;

drops[i]++;

}

}

setInterval(draw,35);

function log(text){

let box=document.getElementById("terminal");

box.innerHTML+="<div>> "+text+"</div>";

box.scrollTop=box.scrollHeight;

}

function startScan(){

document.getElementById("terminal").innerHTML="";

let p=0;

let bar=document.getElementById("bar");

let percent=document.getElementById("percent");

let logs=[
"Initializing security scan...",
"Checking network status...",
"Verifying encrypted channels...",
"Analyzing metadata...",
"Inspecting connection...",
"Running integrity checks...",
"Collecting diagnostics...",
"Generating security report...",
"Finalizing simulation..."
];

let i=0;

let x=setInterval(()=>{

p++;

bar.style.width=p+"%";

percent.innerHTML=p+"%";

if(p%10==0&&i<logs.length){

log(logs[i]);

i++;

}

if(p>=100){

clearInterval(x);

log("Simulation Complete ✔");

}

},70);

}

</script>

</body>
</html>
